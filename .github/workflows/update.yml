name: 更新股灾雷达

on:
  schedule:
    # 每 30 分钟一次。别用整点/半点：GitHub 说那是最忙的时候，定时任务会被延后甚至丢掉
    # （2026-10-21 用 */30 实测：19 小时只跑了 5 次）
    - cron: "17,47 * * * *"
  workflow_dispatch:          # GitHub 网页上的 Run workflow 按钮
    inputs:
      test_push:
        description: "发一条测试推送"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "log/**"              # 每日记录是这个 workflow 自己推回来的，不能再触发自己
      - "**.md"

permissions:
  contents: write             # 推回每日记录（顺便让仓库保持活跃，公开仓库 60 天没动静 GitHub 会停掉定时任务）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 留着上一轮下载的数据：某个数据源临时连不上时，用上一轮的值而不是显示「无数据」
      - name: 取回上一轮的数据
        uses: actions/cache@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 抓数据、重算、生成网页、红灯变多就推送
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}     # 可选；有了它 FRED 在云端几乎不会失败
        run: python run.py --publish --log --notify

      - name: 测试推送
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py --test-push

      - name: 推回每日记录（每天一次）
        run: |
          git config user.name "crash-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add log
          if ! git diff --cached --quiet; then
            git commit -m "每日记录 $(date -u +%F)"
            git push || echo "推送失败（可能刚好有别的提交），下一轮再记"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
