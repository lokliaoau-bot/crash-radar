name: 更新股灾雷达

on:
  schedule:
    # 每 30 分钟抓一次最新数据、重算、发布到手机网页（GitHub 的定时偶尔会晚几分钟）
    - cron: "*/30 * * * *"
  workflow_dispatch:          # GitHub 网页上的 Run workflow 按钮
  push:
    branches: [main]
    paths-ignore:
      - "log/**"              # 每日记录是这个 workflow 自己推回来的，不能再触发自己
      - "**.md"

permissions:
  contents: write             # 推回每日记录（顺便让仓库保持活跃，公开仓库 60 天没动静 GitHub 会停掉定时任务）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓数据、重算、生成网页
        run: python run.py --publish --log

      - name: 推回每日记录（每天一次）
        run: |
          git config user.name "crash-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add log
          if ! git diff --cached --quiet; then
            git commit -m "每日记录 $(date -u +%F)"
            git push || echo "推送失败（可能刚好有别的提交），下一轮再记"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
