name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          t() { printf "%-60s " "$1"; shift; curl -s -o /dev/null -m 20 -w "%{http_code} %{size_download}B %{time_total}s\n" "$@" || echo "FAIL"; }
          t "fredgraph curl-default"  "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GDP"
          t "fredgraph UA crash-radar" -A "crash-radar/1.0" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GDP"
          t "fredgraph http"          "http://fred.stlouisfed.org/graph/fredgraph.csv?id=GDP"
          t "fred home"               "https://fred.stlouisfed.org/"
          t "fred series page"        "https://fred.stlouisfed.org/series/GDP"
          t "fred downloaddata"       -L "https://fred.stlouisfed.org/series/GDP/downloaddata/GDP.csv"
          t "alfred graph"            "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=GDP"
          t "api.stlouisfed (no key)" "https://api.stlouisfed.org/fred/series/observations?series_id=GDP&file_type=json"
          t "treasury yields csv"     "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"
          t "chicagofed nfci csv"     "https://www.chicagofed.org/-/media/publications/nfci/nfci-data-series-csv.csv"
          t "federalreserve.gov z1"   "https://www.federalreserve.gov/releases/z1/"
          t "bls api"                 "https://api.bls.gov/publicAPI/v2/timeseries/data/LNS14000000"
          t "stooq"                   "https://stooq.com/q/d/l/?s=^spx&i=d"
